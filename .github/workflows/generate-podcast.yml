name: Generate Podcast Episodes

on:
  schedule:
    # Check for new posts daily at 9am ET (1pm UTC)
    - cron: "0 13 * * *"
  workflow_dispatch: # Allow manual runs
    inputs:
      regenerate_months:
        description: "Months to regenerate as combined episodes, comma-separated (e.g. may,june,july). Blank = normal cron."
        type: string
        default: ""
      reaudio:
        description: "Months to re-render AUDIO ONLY from the existing transcript (no LLM), comma-separated."
        type: string
        default: ""
      make_videos:
        description: "Months to (re)build the Facebook MP4 from existing audio (no LLM), comma-separated."
        type: string
        default: ""
      send_email:
        description: "Months to re-send the notification email (video link + caption + transcript), comma-separated."
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate new episodes
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SITE_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL_TO: "ryan.finke@gmail.com"
        run: python scripts/generate.py ${{ github.event.inputs.send_email != '' && format('--send-email {0}', github.event.inputs.send_email) || (github.event.inputs.make_videos != '' && format('--make-videos {0}', github.event.inputs.make_videos) || (github.event.inputs.reaudio != '' && format('--reaudio {0}', github.event.inputs.reaudio) || (github.event.inputs.regenerate_months != '' && format('--regenerate-months {0}', github.event.inputs.regenerate_months) || ''))) }}

      - name: Commit new episodes and updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/ transcripts/ videos/ feed.xml state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add new podcast episode(s)"
            git push
          fi

  deploy-pages:
    needs: generate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main  # Get the latest commit (including new episodes)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
